<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="A portfolio of projects.">
  <style>
    :root {
      --bg: #0b0b0d;
      --card: #141418;
      --border: #24242b;
      --text: #e8e8ec;
      --muted: #8b8b96;
      --accent: #9cc8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header, main, footer {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
    }
    header { padding-top: 56px; padding-bottom: 32px; }
    h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: -0.02em; }
    header p { margin: 0; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .tile {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .tile:hover, .tile:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(156, 200, 255, .12);
      outline: none;
    }
    .tile img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      background: #000;
    }
    .tile .body { padding: 14px 16px 16px; }
    .tile h2 { margin: 0 0 4px; font-size: 1.1rem; }
    .tile p { margin: 0; color: var(--muted); font-size: .92rem; }

    footer { padding-top: 48px; padding-bottom: 32px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Portfolio</h1>
    <p>Things I've designed</p>
  </header>

  <main>
    <ul class="grid" id="projects"></ul>
  </main>

  <footer></footer>

  <script>
    // Add a new project: drop its image in /images and add an entry here.
    const projects = [
      {
        title: "Afterglow",
        description: "",
        image: "images/afterglow.webp",
        url: "https://vimuston.github.io/afterglow/"
      },
      {
        title: "AZ-5",
        description: "",
        image: "images/az5.jpg",
        url: "https://vimuston.github.io/az5/"
      },
      {
        title: "LUCA",
        description: "",
        image: "images/luca.jpg",
        url: "https://vimuston.github.io/luca/"
      },
      {
        title: "Terra Viva",
        description: "",
        image: "images/terra-viva.jpg",
        url: "https://vimuston.github.io/terra-viva/"
      },
    ];

    const list = document.getElementById("projects");
    for (const p of projects) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "tile";
      a.href = p.url;

      const img = document.createElement("img");
      img.src = p.image;
      img.alt = p.title + " screenshot";
      img.loading = "lazy";

      const body = document.createElement("div");
      body.className = "body";
      const h2 = document.createElement("h2");
      h2.textContent = p.title;
      body.appendChild(h2);
      if (p.description) {
        const d = document.createElement("p");
        d.textContent = p.description;
        body.appendChild(d);
      }

      a.append(img, body);
      li.appendChild(a);
      list.appendChild(li);
    }
  </script>
</body>
</html>
