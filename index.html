<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="A portfolio of projects.">
  <style>
    :root {
      --bg: #0b0b0d;
      --card: #141418;
      --border: #24242b;
      --text: #e8e8ec;
      --muted: #8b8b96;
      --accent: #9cc8ff;
      --glyph: #6fe3b0;
      --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header, main, footer {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
    }
    header {
      padding-top: 56px; padding-bottom: 32px;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-family: var(--mono); font-size: 2.6rem; line-height: 1.1; letter-spacing: .02em;
    }
    h1 .x { color: var(--glyph); opacity: .8; }
    header p { margin: 0; color: var(--muted); font-family: var(--mono); min-height: 1.5em; }
    header .cur {
      display: inline-block; width: .6em; height: 1.05em; margin-left: 2px; vertical-align: -0.15em;
      background: var(--glyph); animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { header .cur { animation: none; } }
    @media (max-width: 600px) { h1 { font-size: 2rem; } }

    .sound-toggle {
      flex: none;
      font: inherit; font-size: .85rem;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: color .15s ease, border-color .15s ease;
    }
    .sound-toggle:hover, .sound-toggle:focus-visible { color: var(--text); border-color: var(--accent); outline: none; }
    .sound-toggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

    .tile .media .sound-badge {
      position: absolute; right: 10px; bottom: 10px;
      font-size: .75rem; line-height: 1;
      color: #fff; background: rgba(0, 0, 0, .55);
      border-radius: 999px; padding: 5px 8px;
      opacity: 0; transition: opacity .2s ease;
      pointer-events: none;
    }
    body.sound-on .tile:hover .sound-badge { opacity: 1; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .grid > li { display: flex; }
    .tile {
      display: flex;
      flex-direction: column;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .tile:hover, .tile:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(156, 200, 255, .12);
      outline: none;
    }
    .tile .media {
      position: relative;
      flex: none;
      aspect-ratio: 16 / 10;
      background: #000;
      overflow: hidden;
    }
    .tile .media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity .3s ease;
    }
    .tile .media img.contain { object-fit: contain; padding: 6%; }
    .tile .media img.hover { opacity: 0; }
    .tile:hover .media img.hover,
    .tile:focus-visible .media img.hover { opacity: 1; }
    .tile .body { padding: 14px 16px 16px; }
    .tile h2 { margin: 0 0 4px; font-size: 1.1rem; }
    .tile p { margin: 0; color: var(--muted); font-size: .92rem; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    footer { padding-top: 48px; padding-bottom: 32px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1><span class="sr-only">Portfolio</span><span id="title" aria-hidden="true">Portfolio</span></h1>
      <p><span class="sr-only">Interactive experiments in the browser</span><span id="subtitle" aria-hidden="true">Interactive experiments in the browser</span></p>
    </div>
    <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false"
            title="Play a short sound clip from each demo when you hover its tile">♪ Sound off</button>
  </header>

  <main>
    <ul class="grid" id="projects"></ul>
  </main>

  <footer></footer>

  <script>
    // Add a new project: drop its image in /images and add an entry here.
    // Optional: fit: "contain" (show whole image, e.g. a logo), hoverImage: "images/x.webp",
    // hoverPosition: "center bottom" (which part of the hover image to keep when cropped),
    // sound: "audio/x.mp3" (clip played on hover once the visitor turns sound on).
    const projects = [
      {
        title: "Portia",
        description: "Portia labiata, the jumping spider. Become a few millimetres of eyes and silk, alone on a jungle floor where almost everything is bigger than you.",
        image: "images/portia.webp",
        hoverImage: "images/portia-alt.webp",
        url: "https://vimuston.github.io/portia/"
      },
      {
        title: "LUCA",
        description: "Four billion years of evolution, from the first cell to the first land animal, with procedural canvas art and a video finale.",
        image: "images/luca.jpg",
        hoverImage: "images/luca-alt.webp",
        sound: "audio/luca.mp3",
        url: "https://vimuston.github.io/luca/"
      },
      {
        title: "Afterglow",
        description: "Short dungeon adventure with animated ASCII characters and glowing effects.",
        image: "images/afterglow.webp",
        hoverImage: "images/afterglow-alt.webp",
        sound: "audio/afterglow.mp3",
        url: "https://vimuston.github.io/afterglow/"
      },
      {
        title: "Terra Viva",
        description: "Terraform a frozen world from orbit, sleeping through millennia while a simulated climate and biosphere evolve.",
        image: "images/terra-viva.jpg",
        hoverImage: "images/terra-viva-alt.webp",
        sound: "audio/terra-viva.mp3",
        url: "https://vimuston.github.io/terra-viva/"
      },
      {
        title: "Super Dungeon Crawl",
        description: "A touch-friendly mod for Dungeon Crawl Stone Soup, with dynamic lighting and animated spell effects.",
        image: "images/sdc-logo.png",
        fit: "contain",
        hoverImage: "images/sdc-gameplay.webp",
        url: "https://github.com/vimuston/super-dungeon-crawl"
      },
      {
        title: "Helix",
        description: "Zoomable double-helix explorer of three public genomes.",
        image: "images/helix.png",
        hoverImage: "images/helix-sequence.png",
        sound: "audio/helix.mp3",
        url: "https://vimuston.github.io/helix/"
      },
      {
        title: "AZ-5",
        description: "Become Leonid Toptunov, Chernobyl Nuclear Power Plant engineer on that fateful night in 1986.",
        image: "images/az5.jpg",
        hoverImage: "images/az5-alt.png",
        hoverPosition: "center bottom",
        sound: "audio/az5.mp3",
        url: "https://vimuston.github.io/az5/"
      },
    ];

    // Header: the title resolves out of random glyphs (DNA letters and ASCII),
    // then the subtitle types itself. Plain text stays for no-JS and reduced motion.
    (() => {
      const h = document.getElementById("title"), s = document.getElementById("subtitle");
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const T = h.textContent, S = s.textContent, G = "ACGT#%@&*+=<>/\\|";
      s.innerHTML = '<span class="cur"></span>';
      let f = 0;
      const a = setInterval(() => {
        const fixed = Math.floor(f / 3);
        h.innerHTML = [...T].map((c, i) => i < fixed ? c :
          '<span class="x">' + G[Math.floor(Math.random() * G.length)].replace("<", "&lt;").replace(">", "&gt;") + "</span>").join("");
        if (++f > T.length * 3) {
          clearInterval(a);
          h.textContent = T;
          let i = 0;
          const b = setInterval(() => {
            s.innerHTML = S.slice(0, ++i) + '<span class="cur"></span>';
            if (i >= S.length) clearInterval(b);
          }, 35);
        }
      }, 45);
    })();

    // Hover sound: off by default. Browsers only allow audio after the visitor has
    // clicked something, so the header toggle doubles as the unlock.
    const Hover = (() => {
      const VOL = 0.4, FADE_IN = 900, FADE_OUT = 450;
      const clips = new Map();
      let on = false;
      try { on = localStorage.getItem("portfolio-sound") === "1"; } catch {}

      function clip(src) {
        let c = clips.get(src);
        if (!c) {
          const el = new Audio(src);
          el.preload = "auto";
          c = { el, raf: 0 };
          clips.set(src, c);
        }
        return c;
      }
      function fade(c, to, ms, done) {
        clearInterval(c.raf);
        const from = c.el.volume, t0 = performance.now();
        c.raf = setInterval(() => {
          const k = Math.min(1, (performance.now() - t0) / ms);
          c.el.volume = from + (to - from) * k * k * (3 - 2 * k);  // smoothstep: gentle start and end
          if (k >= 1) { clearInterval(c.raf); if (done) done(); }
        }, 25);
      }
      function play(src) {
        if (!on) return;
        const c = clip(src);
        c.want = true;
        c.el.currentTime = 0;
        c.el.volume = 0;
        c.el.play().then(() => {
          if (c.want) fade(c, VOL, FADE_IN); else c.el.pause();  // pointer may have left already
        }).catch(() => {});
      }
      function stop(src) {
        const c = clips.get(src);
        if (!c) return;
        c.want = false;
        if (!c.el.paused) fade(c, 0, FADE_OUT, () => c.el.pause());
      }
      function set(v) {
        on = v;
        try { localStorage.setItem("portfolio-sound", v ? "1" : "0"); } catch {}
        document.body.classList.toggle("sound-on", v);
        btn.setAttribute("aria-pressed", String(v));
        btn.textContent = v ? "♪ Sound on" : "♪ Sound off";
        if (v) projects.forEach((p) => p.sound && clip(p.sound));
        else clips.forEach((c) => { clearInterval(c.raf); c.el.pause(); });
      }
      const btn = document.getElementById("soundToggle");
      btn.addEventListener("click", () => set(!on));
      set(on);
      return { play, stop };
    })();

    const list = document.getElementById("projects");
    for (const p of projects) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.className = "tile";
      a.href = p.url;

      const media = document.createElement("div");
      media.className = "media";
      const img = document.createElement("img");
      img.src = p.image;
      img.alt = p.title + " screenshot";
      img.loading = "lazy";
      if (p.fit === "contain") img.classList.add("contain");
      media.appendChild(img);
      if (p.hoverImage) {
        const hov = document.createElement("img");
        hov.src = p.hoverImage;
        hov.alt = "";
        hov.loading = "lazy";
        hov.className = "hover";
        if (p.hoverPosition) hov.style.objectPosition = p.hoverPosition;
        media.appendChild(hov);
      }
      if (p.sound) {
        const badge = document.createElement("span");
        badge.className = "sound-badge";
        badge.textContent = "♪";
        badge.setAttribute("aria-hidden", "true");
        media.appendChild(badge);
        a.addEventListener("mouseenter", () => Hover.play(p.sound));
        a.addEventListener("mouseleave", () => Hover.stop(p.sound));
      }

      const body = document.createElement("div");
      body.className = "body";
      const h2 = document.createElement("h2");
      h2.textContent = p.title;
      body.appendChild(h2);
      if (p.description) {
        const d = document.createElement("p");
        d.textContent = p.description;
        body.appendChild(d);
      }

      a.append(media, body);
      li.appendChild(a);
      list.appendChild(li);
    }
  </script>
</body>
</html>
